<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#131a2b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="320" fill="url(#bg2)" rx="14"/>

  <text x="30" y="36" font-family="'Courier New', monospace" font-size="18" fill="#D4AF37" font-weight="700">$KVAI — mood while debugging (24H)</text>
  <text x="30" y="58" font-family="'Courier New', monospace" font-size="13" fill="#8b949e">not financial advice. definitely not emotional advice either.</text>

  <!-- gridlines -->
  <g stroke="#21262d" stroke-width="1">
    <line x1="30" y1="90" x2="870" y2="90"/>
    <line x1="30" y1="140" x2="870" y2="140"/>
    <line x1="30" y1="190" x2="870" y2="190"/>
    <line x1="30" y1="240" x2="870" y2="240"/>
    <line x1="30" y1="290" x2="870" y2="290"/>
  </g>

  <!-- candlesticks: green = up (confidence), red = down (stack overflow moment) -->
  <g>
    <!-- opened project, feeling good -->
    <line x1="70" y1="150" x2="70" y2="200" stroke="#3fb950"/>
    <rect x="60" y="160" width="20" height="30" fill="#3fb950"/>

    <line x1="120" y1="130" x2="120" y2="180" stroke="#3fb950"/>
    <rect x="110" y="140" width="20" height="30" fill="#3fb950"/>

    <!-- first bug appears -->
    <line x1="170" y1="150" x2="170" y2="260" stroke="#f85149"/>
    <rect x="160" y="180" width="20" height="60" fill="#f85149"/>

    <!-- stack overflow, rock bottom -->
    <line x1="220" y1="230" x2="220" y2="300" stroke="#f85149"/>
    <rect x="210" y="250" width="20" height="45" fill="#f85149"/>

    <line x1="270" y1="260" x2="270" y2="305" stroke="#f85149"/>
    <rect x="260" y="270" width="20" height="30" fill="#f85149"/>

    <!-- copy-pasted a fix, cautious recovery -->
    <line x1="320" y1="240" x2="320" y2="280" stroke="#3fb950"/>
    <rect x="310" y="250" width="20" height="25" fill="#3fb950"/>

    <line x1="370" y1="200" x2="370" y2="250" stroke="#3fb950"/>
    <rect x="360" y="210" width="20" height="35" fill="#3fb950"/>

    <!-- realized the fix broke something else -->
    <line x1="420" y1="190" x2="420" y2="270" stroke="#f85149"/>
    <rect x="410" y="210" width="20" height="55" fill="#f85149"/>

    <!-- 2am clarity strikes -->
    <line x1="470" y1="150" x2="470" y2="220" stroke="#3fb950"/>
    <rect x="460" y="160" width="20" height="55" fill="#3fb950"/>

    <line x1="520" y1="100" x2="520" y2="170" stroke="#3fb950"/>
    <rect x="510" y="110" width="20" height="55" fill="#3fb950"/>

    <!-- tests pass on first try, suspicious -->
    <line x1="570" y1="60" x2="570" y2="120" stroke="#3fb950"/>
    <rect x="560" y="70" width="20" height="45" fill="#3fb950"/>

    <!-- realize you forgot to save -->
    <line x1="620" y1="90" x2="620" y2="260" stroke="#f85149"/>
    <rect x="610" y="150" width="20" height="90" fill="#f85149"/>

    <!-- redo it, ship it -->
    <line x1="670" y1="80" x2="670" y2="180" stroke="#3fb950"/>
    <rect x="660" y="90" width="20" height="80" fill="#3fb950"/>

    <line x1="720" y1="40" x2="720" y2="110" stroke="#3fb950"/>
    <rect x="710" y="50" width="20" height="55" fill="#3fb950"/>

    <!-- PR merged, all-time high -->
    <line x1="770" y1="20" x2="770" y2="80" stroke="#3fb950"/>
    <rect x="760" y="25" width="20" height="50" fill="#3fb950"/>

    <line x1="820" y1="15" x2="820" y2="60" stroke="#3fb950"/>
    <rect x="810" y="18" width="20" height="35" fill="#3fb950"/>
  </g>

  <text x="820" y="90" text-anchor="end" font-family="'Courier New', monospace" font-size="12" fill="#3fb950">PR merged 🚀</text>
  <text x="220" y="316" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#f85149">stack overflow moment 📉</text>
</svg>

<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0221"/>
      <stop offset="45%" stop-color="#1a0b3d"/>
      <stop offset="75%" stop-color="#3a1256"/>
      <stop offset="100%" stop-color="#5c1a4a"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7d6"/>
      <stop offset="60%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b0221" stop-opacity="1"/>
      <stop offset="8%" stop-color="#0b0221" stop-opacity="0"/>
      <stop offset="92%" stop-color="#0b0221" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0b0221" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="300"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- sky -->
    <rect x="0" y="0" width="1200" height="300" fill="url(#sky)"/>

    <!-- moon glow -->
    <circle cx="1040" cy="70" r="90" fill="url(#moon)" opacity="0.55"/>
    <circle cx="1040" cy="70" r="28" fill="#fff7d6"/>

    <!-- twinkling stars -->
    <g fill="#ffe9a8">
      <circle cx="80" cy="40" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="220" cy="65" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="360" cy="30" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="55" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="35" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="850" cy="20" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="150" cy="90" r="1"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- ================= FAR SKYLINE (slow parallax) ================= -->
    <g id="farLayer">
      <g id="farA" transform="translate(0,0)">
        <!-- one tile of far buildings, 1200 wide, repeated -->
        <g fill="#241245" opacity="0.9">
          <rect x="20" y="150" width="60" height="150"/>
          <rect x="90" y="120" width="45" height="180"/>
          <rect x="150" y="170" width="70" height="130"/>
          <rect x="240" y="100" width="40" height="200"/>
          <rect x="300" y="160" width="55" height="140"/>
          <rect x="380" y="130" width="65" height="170"/>
          <rect x="470" y="150" width="50" height="150"/>
          <rect x="540" y="110" width="42" height="190"/>
          <rect x="610" y="165" width="60" height="135"/>
          <rect x="700" y="140" width="48" height="160"/>
          <rect x="770" y="120" width="55" height="180"/>
          <rect x="850" y="160" width="65" height="140"/>
          <rect x="940" y="105" width="40" height="195"/>
          <rect x="1000" y="150" width="58" height="150"/>
          <rect x="1080" y="130" width="45" height="170"/>
          <rect x="1150" y="165" width="45" height="135"/>
        </g>
      </g>
      <g id="farB" transform="translate(1200,0)">
        <g fill="#241245" opacity="0.9">
          <rect x="20" y="150" width="60" height="150"/>
          <rect x="90" y="120" width="45" height="180"/>
          <rect x="150" y="170" width="70" height="130"/>
          <rect x="240" y="100" width="40" height="200"/>
          <rect x="300" y="160" width="55" height="140"/>
          <rect x="380" y="130" width="65" height="170"/>
          <rect x="470" y="150" width="50" height="150"/>
          <rect x="540" y="110" width="42" height="190"/>
          <rect x="610" y="165" width="60" height="135"/>
          <rect x="700" y="140" width="48" height="160"/>
          <rect x="770" y="120" width="55" height="180"/>
          <rect x="850" y="160" width="65" height="140"/>
          <rect x="940" y="105" width="40" height="195"/>
          <rect x="1000" y="150" width="58" height="150"/>
          <rect x="1080" y="130" width="45" height="170"/>
          <rect x="1150" y="165" width="45" height="135"/>
        </g>
      </g>
      <animateTransform xlink:href="#farA" attributeName="transform" type="translate" from="0,0" to="-1200,0" dur="40s" repeatCount="indefinite"/>
      <animateTransform xlink:href="#farB" attributeName="transform" type="translate" from="1200,0" to="0,0" dur="40s" repeatCount="indefinite"/>
    </g>

    <!-- ================= MID SKYLINE (medium parallax + lit windows) ================= -->
    <g id="midLayer">
      <g id="midA" transform="translate(0,0)">
        <g>
          <rect x="0" y="190" width="80" height="110" fill="#150a2e"/>
          <rect x="100" y="160" width="55" height="140" fill="#150a2e"/>
          <rect x="180" y="200" width="90" height="100" fill="#150a2e"/>
          <rect x="300" y="140" width="50" height="160" fill="#150a2e"/>
          <rect x="380" y="180" width="70" height="120" fill="#150a2e"/>
          <rect x="480" y="150" width="60" height="150" fill="#150a2e"/>
          <rect x="570" y="195" width="85" height="105" fill="#150a2e"/>
          <rect x="680" y="165" width="55" height="135" fill="#150a2e"/>
          <rect x="760" y="140" width="65" height="160" fill="#150a2e"/>
          <rect x="850" y="185" width="75" height="115" fill="#150a2e"/>
          <rect x="950" y="155" width="60" height="145" fill="#150a2e"/>
          <rect x="1040" y="190" width="80" height="110" fill="#150a2e"/>
          <rect x="1140" y="160" width="60" height="140" fill="#150a2e"/>
          <!-- lit windows -->
          <g fill="url(#goldGlow)">
            <rect x="10" y="205" width="6" height="8"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></rect>
            <rect x="25" y="220" width="6" height="8"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></rect>
            <rect x="115" y="180" width="6" height="8"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></rect>
            <rect x="195" y="220" width="6" height="8"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.6s" repeatCount="indefinite"/></rect>
            <rect x="315" y="165" width="6" height="8"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></rect>
            <rect x="400" y="205" width="6" height="8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></rect>
            <rect x="495" y="175" width="6" height="8"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" repeatCount="indefinite"/></rect>
            <rect x="590" y="215" width="6" height="8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite"/></rect>
            <rect x="695" y="190" width="6" height="8"><animate attributeName="opacity" values="1;0.4;1" dur="3.1s" repeatCount="indefinite"/></rect>
            <rect x="775" y="165" width="6" height="8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/></rect>
            <rect x="865" y="205" width="6" height="8"><animate attributeName="opacity" values="1;0.2;1" dur="3.3s" repeatCount="indefinite"/></rect>
            <rect x="965" y="180" width="6" height="8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></rect>
            <rect x="1055" y="210" width="6" height="8"><animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/></rect>
            <rect x="1155" y="185" width="6" height="8"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.9s" repeatCount="indefinite"/></rect>
          </g>
        </g>
      </g>
      <g id="midB" transform="translate(1200,0)">
        <use href="#midA"/>
      </g>
      <animateTransform xlink:href="#midA" attributeName="transform" type="translate" from="0,0" to="-1200,0" dur="26s" repeatCount="indefinite"/>
      <animateTransform xlink:href="#midB" attributeName="transform" type="translate" from="1200,0" to="0,0" dur="26s" repeatCount="indefinite"/>
    </g>

    <!-- ================= FRONT SKYLINE (fast parallax, tallest + gold spires) ================= -->
    <g id="frontLayer">
      <g id="frontA" transform="translate(0,0)">
        <g fill="#0a0517">
          <rect x="30" y="230" width="70" height="70"/>
          <rect x="120" y="200" width="50" height="100"/>
          <rect x="190" y="240" width="90" height="60"/>
          <!-- tall gold-tipped spire, "richest" building -->
          <rect x="300" y="150" width="55" height="150"/>
          <polygon points="300,150 355,150 327,110"/>
          <rect x="324" y="90" width="6" height="24" fill="url(#goldGlow)"/>
          <rect x="390" y="220" width="65" height="80"/>
          <rect x="480" y="245" width="80" height="55"/>
          <rect x="590" y="210" width="55" height="90"/>
          <rect x="670" y="235" width="70" height="65"/>
          <rect x="770" y="190" width="50" height="110"/>
          <rect x="850" y="240" width="85" height="60"/>
          <rect x="960" y="215" width="60" height="85"/>
          <rect x="1050" y="245" width="70" height="55"/>
          <rect x="1140" y="220" width="60" height="80"/>
        </g>
        <g fill="url(#goldGlow)" opacity="0.9">
          <rect x="45" y="245" width="7" height="9"/>
          <rect x="140" y="215" width="7" height="9"/>
          <rect x="215" y="255" width="7" height="9"/>
          <rect x="410" y="235" width="7" height="9"/>
          <rect x="505" y="260" width="7" height="9"/>
          <rect x="610" y="225" width="7" height="9"/>
          <rect x="695" y="250" width="7" height="9"/>
          <rect x="790" y="205" width="7" height="9"/>
          <rect x="875" y="255" width="7" height="9"/>
          <rect x="985" y="230" width="7" height="9"/>
          <rect x="1070" y="260" width="7" height="9"/>
          <rect x="1160" y="235" width="7" height="9"/>
        </g>
      </g>
      <g id="frontB" transform="translate(1200,0)">
        <use href="#frontA"/>
      </g>
      <animateTransform xlink:href="#frontA" attributeName="transform" type="translate" from="0,0" to="-1200,0" dur="16s" repeatCount="indefinite"/>
      <animateTransform xlink:href="#frontB" attributeName="transform" type="translate" from="1200,0" to="0,0" dur="16s" repeatCount="indefinite"/>
    </g>

    <!-- moving car light trail along the base -->
    <g>
      <rect x="0" y="296" width="1200" height="4" fill="#1a0b2e"/>
      <circle cx="0" cy="298" r="2.4" fill="#ffd27a">
        <animate attributeName="cx" values="-20;1220" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="298" r="1.8" fill="#ff6b6b">
        <animate attributeName="cx" values="1220;-20" dur="6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- title -->
    <text x="600" y="90" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="url(#goldGlow)" letter-spacing="2">KOUSHIK VENKATESAN</text>
    <text x="600" y="122" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" fill="#f3e6c8" opacity="0.9" letter-spacing="1">AI Engineer &#183; I code till the vibe ends</text>

    <!-- edge fade for seamless loop illusion -->
    <rect x="0" y="0" width="1200" height="300" fill="url(#fade)"/>
  </g>
</svg>

<svg width="1200" height="60" viewBox="0 0 1200 60" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="edgeFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0e17" stop-opacity="1"/>
      <stop offset="5%" stop-color="#0a0e17" stop-opacity="0"/>
      <stop offset="95%" stop-color="#0a0e17" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0e17" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="tframe"><rect x="0" y="0" width="1200" height="60"/></clipPath>
  </defs>
  <g clip-path="url(#tframe)">
    <rect width="1200" height="60" fill="url(#tbg)"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#D4AF37" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="59" x2="1200" y2="59" stroke="#D4AF37" stroke-width="1" opacity="0.5"/>

    <g font-family="'Courier New', monospace" font-size="16" font-weight="700">
      <g id="tapeA" transform="translate(0,0)">
        <text x="0" y="37" fill="#3fb950">$KVAI +420%</text>
        <text x="150" y="37" fill="#D4AF37">🚀 SHIP IT</text>
        <text x="280" y="37" fill="#f85149">BUY THE DIP ON BUGS</text>
        <text x="500" y="37" fill="#3fb950">TAMPER-EVIDENT LOGS ▲</text>
        <text x="780" y="37" fill="#D4AF37">LEDGERLOCK: TRENDING</text>
        <text x="990" y="37" fill="#f85149">console.log() SHORT SQUEEZE</text>
      </g>
      <g id="tapeB" transform="translate(1200,0)">
        <text x="0" y="37" fill="#3fb950">$KVAI +420%</text>
        <text x="150" y="37" fill="#D4AF37">🚀 SHIP IT</text>
        <text x="280" y="37" fill="#f85149">BUY THE DIP ON BUGS</text>
        <text x="500" y="37" fill="#3fb950">TAMPER-EVIDENT LOGS ▲</text>
        <text x="780" y="37" fill="#D4AF37">LEDGERLOCK: TRENDING</text>
        <text x="990" y="37" fill="#f85149">console.log() SHORT SQUEEZE</text>
      </g>
      <animateTransform xlink:href="#tapeA" attributeName="transform" type="translate" from="0,0" to="-1200,0" dur="18s" repeatCount="indefinite"/>
      <animateTransform xlink:href="#tapeB" attributeName="transform" type="translate" from="1200,0" to="0,0" dur="18s" repeatCount="indefinite"/>
    </g>

    <rect x="0" y="0" width="1200" height="60" fill="url(#edgeFade)"/>
  </g>
</svg>
